name: Update Tech Stack Dashboard

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch: {}    # allow manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate-dashboard.mjs"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard SVGs
        env:
          GH_USERNAME: wakhidpangestu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-dashboard.mjs

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/dashboard-dark.svg assets/dashboard-light.svg
          git diff --cached --quiet || git commit -m "chore: update tech stack dashboard [skip ci]"
          git push
